<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flight Tracker</title>
  <!-- trek:ui -->
  <style>
    :root { color-scheme: light; --ft-surface: rgba(0,0,0,.045); --ft-surface-line: rgba(0,0,0,.07); --ft-land: rgba(0,0,0,.13); }
    :root[data-theme="dark"] { color-scheme: dark; --ft-surface: rgba(0,0,0,.32); --ft-surface-line: rgba(255,255,255,.06); --ft-land: rgba(255,255,255,.14); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme]) { color-scheme: dark; --ft-surface: rgba(0,0,0,.32); --ft-surface-line: rgba(255,255,255,.06); --ft-land: rgba(255,255,255,.14); } }
    body { margin: 0; }
    #app { padding: 4px 2px; font-variant-numeric: tabular-nums; }
    /* non-flight reservation: collapse to nothing. The host kit only reports a
       resize when height > 0 (never 0), so instead of an empty ~8px box we shrink
       the root to a 1px, overflow-hidden sliver — effectively invisible. */
    :root[data-ft-empty] #app { padding: 0; height: 1px; overflow: hidden; }
    /* keep the chrome (footer, hints, empty states, inputs) aligned with panel text */
    .ft-foot, .ft-err, .ft-empty, .ft-hint, .ft-keyrow, .ft-editrow, .ft-note, #app > .ft-skel { padding-inline: 14px; }
    svg { flex-shrink: 0; }
    .ft-icon { width: 1em; height: 1em; vertical-align: -0.125em; }

    /* filled panels that echo TREK's reservation-card field boxes (darker than the card) */
    .ft-panel { background: var(--ft-surface); border: 1px solid var(--ft-surface-line); border-radius: var(--radius-md, 12px); padding: 12px 14px; }
    .ft-panel + .ft-panel { margin-top: 8px; }

    /* total-route header */
    .ft-journey { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 10px 14px; border-radius: var(--radius-md,12px); background: var(--ft-surface); border: 1px solid var(--ft-surface-line); }
    .ft-journey .rt { font-size: 15px; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ft-journey .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .ft-journey .spacer { flex: 1; }

    /* countdown */
    .ft-countdown { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 9px 13px; border-radius: var(--radius-md,12px); background: color-mix(in srgb, var(--accent, #3b82f6) 12%, transparent); color: var(--text-secondary); font-size: 13px; font-weight: 600; }
    .ft-countdown b { color: var(--text-primary); }
    .ft-countdown .ft-icon { color: var(--accent, #3b82f6); }

    /* cancelled banner */
    .ft-banner { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 10px 13px; border-radius: var(--radius-md,12px); background: color-mix(in srgb, var(--danger,#dc2626) 14%, transparent); color: var(--danger,#dc2626); font-weight: 600; font-size: 13px; }

    .ft-leg { position: relative; }
    .ft-leg + .ft-layover, .ft-layover + .ft-leg { margin-top: 8px; }
    .ft-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .ft-seq { font-size: 10px; font-weight: 700; color: var(--text-faint); border: 1px solid var(--border-faint); border-radius: 5px; padding: 1px 5px; }
    .ft-flight { font-size: 15px; font-weight: 700; letter-spacing: .2px; }
    .ft-air { color: var(--text-muted); font-size: 12px; }

    /* PILLS = TREK's own .trek-chip. The widget deliberately keeps no chip of its
       own: the neutral tier is the unmodified kit chip (--accent-subtle ground,
       borderless), and colour only ever comes from the kit's semantic modifiers.
       Sized one notch down widget-wide so a 320px sidebar still fits a cluster. */
    #app .trek-chip { font-size: 11px; padding: 3px 9px; gap: 5px; max-width: 100%; min-width: 0; }
    #app .trek-chip .ft-icon { width: 12px; height: 12px; }
    .ft-head .trek-chip { margin-inline-start: auto; }   /* status chip stays end-aligned (mirrors in RTL) */

    /* key/value inside a chip — the one thing the kit has no component for.
       .ft-v always carries the truncation so a long value can never force the
       nowrap chip to overflow a narrow widget. */
    .ft-p .ft-k { color: var(--text-muted); font-weight: 500; }
    .ft-p .ft-v { color: var(--text-primary); font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .ft-p.trek-chip--accent .ft-k, .ft-p.trek-chip--success .ft-k, .ft-p.trek-chip--warning .ft-k,
    .ft-p.trek-chip--info .ft-k, .ft-p.trek-chip--danger .ft-k { color: currentColor; opacity: .7; }
    .ft-p.trek-chip--accent .ft-v, .ft-p.trek-chip--success .ft-v, .ft-p.trek-chip--warning .ft-v,
    .ft-p.trek-chip--info .ft-v, .ft-p.trek-chip--danger .ft-v { color: currentColor; }

    /* GROUPED FACT BANDS. What fixed the "jumbled run-on" is less the pills than
       the fixed left rail: every band label lines up in one column, so terminal /
       seat / weather read as three labelled groups instead of three loose rows.
       Separation is a hairline, not whitespace — density is preserved. */
    .ft-band { display: grid; grid-template-columns: 58px minmax(0, 1fr); align-items: start; gap: 6px 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-faint); }
    .ft-band--first { margin-top: 10px; padding-top: 0; border-top: 0; }
    .ft-bandbody { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .ft-band--stack .ft-bandbody { gap: 4px; }
    /* The label WRAPS rather than truncating: at 320px "In the air" would ellipsise
       to "In th…", which defeats the rail. It wraps only at SPACES — break-word
       would split "Progress" into "PROGRE/SS". The rail is sized so the longest
       single word still fits on one line. */
    .ft-blabel { font-size: 10px; letter-spacing: .04em; line-height: 1.3; padding-top: 4px; min-width: 0; overflow-wrap: normal; word-break: normal; hyphens: none; }
    .ft-cl { gap: 6px; }

    /* Measurements are NOT pills — this is the counterweight that stops the bands
       becoming pill soup. Categorical + stable = chip; measured + changing = numeral. */
    .ft-num { font-size: 15px; font-weight: 700; color: var(--text-primary); display: inline-flex; align-items: center; gap: 5px; line-height: 1.15; }
    .ft-num--sm { font-size: 12px; font-weight: 600; }
    .ft-icon--wx { width: 16px; height: 16px; color: var(--text-muted); }
    .ft-sub { font-size: 11px; line-height: 1.35; }
    .ft-nosig { margin: 2px 0 0; font-size: 11px; }
    .ft-dot--idle { background: var(--text-faint); }
    /* visually hidden, still announced */
    .ft-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
    .ft-progrow { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .ft-grow { flex: 1 1 auto; }
    .ft-coords { font-size: 10px; color: var(--text-muted); }
    .ft-btn-xs { padding: 3px 9px; font-size: 11px; gap: 5px; border-radius: 999px; text-decoration: none; line-height: 1.4; }
    .ft-btn-xs .ft-icon { width: 12px; height: 12px; }
    .ft-btn-xs:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* Narrow sidebar: the rail SHRINKS but never stacks — stacking would destroy
       the column alignment at exactly the width where it matters most.
       NB: this is the NARROW-DESKTOP branch and it deliberately excludes the phone.
       A phone viewport is narrow too, but shrinking type and touch targets there is
       exactly the wrong direction — the phone branch below grows them instead. */
    @media (max-width: 340px) {
      :root:not([data-form-factor="phone"]) .ft-band { grid-template-columns: 50px minmax(0, 1fr); gap: 5px 8px; }
      :root:not([data-form-factor="phone"]) .ft-blabel { font-size: 9px; letter-spacing: .01em; }
      :root:not([data-form-factor="phone"]) #app .trek-chip { font-size: 10px; padding: 3px 8px; gap: 4px; }
      :root:not([data-form-factor="phone"]) .ft-num { font-size: 14px; }
      :root:not([data-form-factor="phone"]) .ft-wxtail { display: none; }
    }

    .ft-route { display: grid; grid-template-columns: 1fr 40px 1fr; align-items: start; gap: 6px; }
    .ft-ap { min-width: 0; }
    .ft-ap.arr { text-align: end; }
    .ft-iata { font-size: 18px; font-weight: 700; line-height: 1.05; }
    .ft-apname { color: var(--text-muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ft-arrow { color: var(--text-faint); display: flex; justify-content: center; padding-top: 3px; }

    .ft-times { display: grid; grid-template-columns: 1fr 40px 1fr; gap: 6px; margin-top: 8px; }
    .ft-times .arr { text-align: end; }
    .ft-times .mid { }
    .ft-t-label { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); }
    .ft-t-sched { font-size: 15px; font-weight: 600; }
    .ft-t-rev { font-size: 12px; display: inline-flex; align-items: center; gap: 2px; }
    .ft-t-rev.late { color: var(--danger,#dc2626); }
    .ft-t-rev.early { color: var(--success,#16a34a); }
    .ft-strike { text-decoration: line-through; color: var(--text-faint); font-weight: 400; }

    /* progress bar (en route) */
    /* Logical insets so the bar runs departure -> arrival in BOTH directions: in RTL
       the route grid already mirrors, and a physically-left-anchored bar would then
       fill away from the departure airport. */
    .ft-prog { position: relative; height: 8px; margin: 12px 2px 4px; }
    .ft-prog .track, .ft-prog .fill { position: absolute; inset-inline-start: 0; top: 3px; height: 2px; border-radius: 2px; }
    .ft-prog .track { inset-inline-end: 0; background: var(--border-faint, rgba(0,0,0,.12)); }
    .ft-prog .fill { background: var(--success, #16a34a); }
    .ft-prog .end { position: absolute; top: 2px; inset-inline-start: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--text-faint, #999); }
    .ft-prog .end.r { inset-inline-start: auto; inset-inline-end: 0; background: var(--border-primary, #bbb); }
    .ft-prog .dot { position: absolute; top: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--success, #16a34a); box-shadow: 0 0 0 2px var(--bg-card, #fff); transform: translateX(-50%); }
    :root[dir="rtl"] .ft-prog .dot { transform: translateX(50%); }

    .ft-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success,#16a34a); flex: 0 0 auto; }
    /* auto-fit, not repeat(3,1fr): registration moved out to a chip, so two tiles
       share the width and "34,000 ft" can never wrap mid-number on a narrow card */
    .ft-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 8px 12px; }
    .ft-stat .v { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 3px; }
    .ft-stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-faint); }
    /* minimap (bundled inline vector world — no external tiles) */
    .ft-minimap { margin-top: 10px; border-radius: var(--radius-md,12px); overflow: hidden; background: var(--ft-surface); border: 1px solid var(--ft-surface-line); }
    .ft-minimap svg { display: block; width: 100%; height: 132px; }
    @media (prefers-reduced-motion: no-preference) { :root:not([data-reduce-motion]) .ft-planepulse { animation: ftpulse 2.2s ease-out infinite; } }

    /* layover connector */
    .ft-layover { display: flex; align-items: center; gap: 8px; margin: 2px 0; margin-inline-start: 4px; font-size: 11px; color: var(--text-muted); }
    .ft-layover .ln { width: 2px; align-self: stretch; min-height: 16px; background: var(--border-faint); border-radius: 2px; margin-inline-start: 8px; }
    .ft-layover.tight { color: var(--warning,#d97706); font-weight: 600; }
    .ft-layover.tight .ln { background: var(--warning,#d97706); }
    .ft-layover.broken { color: var(--danger,#dc2626); font-weight: 600; }
    .ft-layover.broken .ln { background: var(--danger,#dc2626); }

    /* collapsed completed leg */
    .ft-collapsed { width: 100%; text-align: start; font: inherit; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 12px; color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-md,12px); background: var(--ft-surface); border: 1px solid var(--ft-surface-line); }
    .ft-collapsed:hover { background: color-mix(in srgb, var(--text-primary) 6%, transparent); }
    .ft-collapsed:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .ft-collapsed .ft-icon { color: var(--success,#16a34a); }
    /* the route pair is three flex items, not one text run, so RTL reorders the
       endpoints around the (mirrored) separator instead of leaving a stray glyph */
    .ft-collapsed .grow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; }
    .ft-collapsed .rt { font-weight: 600; color: var(--text-primary); }

    .ft-homez { font-size: 11px; color: var(--text-faint); margin-top: 1px; }

    /* footer + actions */
    .ft-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
    .ft-updated { font-size: 11px; color: var(--text-muted); }
    .ft-actions { display: flex; gap: 2px; }
    .ft-iconbtn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 8px; display: inline-flex; line-height: 0; }
    .ft-iconbtn .ft-icon { width: 16px; height: 16px; }
    .ft-iconbtn:hover { background: var(--bg-hover, rgba(0,0,0,.06)); color: var(--text-primary); }
    .ft-iconbtn:focus-visible { outline: 2px solid var(--accent,#2563eb); outline-offset: 1px; }

    .ft-editrow { display: flex; gap: 6px; margin-top: 8px; }
    .ft-editrow input { flex: 1; min-width: 0; }
    .ft-empty { color: var(--text-muted); font-size: 12px; }
    .ft-hint { color: var(--text-faint); font-size: 11px; margin-top: 8px; }
    .ft-keyadmin { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; line-height: 1.4; }
    .ft-keyadmin svg { flex: 0 0 auto; width: 13px; height: 13px; opacity: .8; }
    .ft-err { color: var(--danger,#dc2626); font-size: 11px; margin-top: 6px; }
    .ft-keyrow { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border-faint); }
    .ft-keytoggle { background: none; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; padding: 3px 0; display: inline-flex; align-items: center; gap: 5px; }
    .ft-keytoggle:hover { color: var(--text-secondary); }
    .ft-keytoggle .ft-icon { width: 13px; height: 13px; }

    /* skeleton */
    .ft-skel { border-radius: var(--radius-md,12px); background: linear-gradient(90deg, var(--bg-hover,rgba(0,0,0,.05)) 25%, color-mix(in srgb, var(--text-primary) 8%, transparent) 37%, var(--bg-hover,rgba(0,0,0,.05)) 63%); background-size: 400% 100%; }
    .ft-skel.line { height: 12px; margin: 8px 0; }
    .ft-skel.big { height: 56px; margin-bottom: 10px; }

    /* motion — all guarded TWICE: by the OS media query AND by [data-reduce-motion],
       which the kit sets on <html> from appearance.reducedMotion. That is TREK's own
       in-app switch; a user who turns motion off inside TREK while their OS still says
       "no-preference" was previously still getting the pulse, shimmer and spinner. */
    @media (prefers-reduced-motion: no-preference) {
      :root:not([data-reduce-motion]) button.ft-iconbtn:active,
      :root:not([data-reduce-motion]) .ft-collapsed:active { transform: scale(.96); }
      :root:not([data-reduce-motion]) .ft-iconbtn,
      :root:not([data-reduce-motion]) .ft-collapsed { transition: transform 120ms cubic-bezier(.23,1,.32,1), background-color 140ms, color 140ms; }
      :root:not([data-reduce-motion]) .ft-dot.pulse { animation: ftpulse 2.2s ease-out infinite; }
      @keyframes ftpulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--success,#16a34a) 55%, transparent); } 70% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--success,#16a34a) 0%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
      :root:not([data-reduce-motion]) .ft-spin { animation: ftspin .9s linear infinite; }
      @keyframes ftspin { to { transform: rotate(360deg); } }
      :root:not([data-reduce-motion]) .ft-skel { animation: ftshimmer 1.4s ease infinite; }
      @keyframes ftshimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    }

    /* stale / throttled / quota / rejected-key notes, just under the footer */
    .ft-note { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; font-size: 11px; line-height: 1.35; color: var(--text-muted); }
    .ft-note .ft-icon { width: 12px; height: 12px; margin-top: 2px; }
    .ft-note--warn { color: var(--warning,#d97706); }
    .ft-note--danger { color: var(--danger,#dc2626); }
    /* a load-bearing URL rendered as copyable text, so it survives a blocked popup */
    .ft-url { display: block; margin-top: 3px; font-size: 10px; word-break: break-all; user-select: all; -webkit-user-select: all; }

    /* RTL: the route chevron is the one icon with a direction. Only icons carrying
       .ft-rtlflip mirror — the alert/up/down glyphs must never be flipped. */
    :root[dir="rtl"] .ft-rtlflip { transform: scaleX(-1); }

    /* ---- PHONE (viewport.formFactor === 'phone'; the kit sets data-form-factor) ----
       Deliberately independent of the max-width:340px narrow-desktop branch above.
       Four rules decide whether embedded UI feels native on a phone: targets >= 44px,
       inputs >= 16px, feedback on :active (touch has no :hover), and no drop shadows.
       Surfaces branch onto the --m-* mobile token family BY PRESENCE, so the same CSS
       is correct on desktop where those variables do not exist. */
    :root[data-form-factor="phone"] { --ft-surface: var(--m-card, rgba(0,0,0,.045)); --ft-surface-line: var(--m-cbr, rgba(0,0,0,.07)); }
    :root[data-form-factor="phone"][data-theme="dark"] { --ft-surface: var(--m-card, rgba(0,0,0,.32)); --ft-surface-line: var(--m-cbr, rgba(255,255,255,.06)); }
    [data-form-factor="phone"] #app { padding: 6px 2px; }
    [data-form-factor="phone"] .ft-iconbtn { min-width: 44px; min-height: 44px; padding: 12px; border-radius: 12px; justify-content: center; }
    [data-form-factor="phone"] .ft-iconbtn .ft-icon { width: 20px; height: 20px; }
    [data-form-factor="phone"] .ft-actions { gap: 4px; }
    [data-form-factor="phone"] .ft-btn-xs { min-height: 44px; padding: 10px 16px; font-size: 13px; }
    [data-form-factor="phone"] .ft-btn-xs .ft-icon { width: 15px; height: 15px; }
    [data-form-factor="phone"] .ft-keytoggle { min-height: 44px; padding: 12px 0; font-size: 13px; }
    [data-form-factor="phone"] .ft-keytoggle .ft-icon { width: 16px; height: 16px; }
    [data-form-factor="phone"] .ft-collapsed { min-height: 48px; padding: 12px; }
    /* iOS zooms the page — and stays zoomed — on any input below 16px */
    [data-form-factor="phone"] #app .trek-input { font-size: 16px; min-height: 44px; }
    [data-form-factor="phone"] #app .trek-btn { min-height: 44px; box-shadow: none; }
    /* A drop shadow over the translucent mobile surface reads as a sticker. */
    [data-form-factor="phone"] .ft-prog .dot { box-shadow: 0 0 0 2px var(--m-card, var(--bg-card, #fff)); }
    /* Touch never fires :hover, so a tap had no feedback at all; and this feedback
       must survive reduced motion, hence opacity rather than a transform. */
    [data-form-factor="phone"] .ft-iconbtn:hover { background: none; color: var(--text-muted); }
    [data-form-factor="phone"] .ft-collapsed:hover { background: var(--ft-surface); }
    [data-form-factor="phone"] .ft-iconbtn:active,
    [data-form-factor="phone"] .ft-keytoggle:active,
    [data-form-factor="phone"] .ft-btn-xs:active,
    [data-form-factor="phone"] .ft-collapsed:active { opacity: .62; }
  </style>
</head>
<body>
  <div id="app"><div class="ft-skel big"></div><div class="ft-skel line" style="width:60%"></div></div>
  <!-- Sibling of #app on purpose: render() rebuilds #app, and rebuilding a live
       region cancels pending announcements. -->
  <div id="ft-live" class="ft-sr" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
  (function () {
    var PLANE_D = 'M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z';
    // a compact plane silhouette pointing UP (north) — for the heading marker on the map
    var PLANE_N = 'M0 -9 C1.3 -9 1.8 -6.2 1.8 -3.6 L8.6 1 L8.6 2.7 L1.8 0.6 L1.8 4.7 L3.7 6.3 L3.7 7.5 L0 6.3 L-3.7 7.5 L-3.7 6.3 L-1.8 4.7 L-1.8 0.6 L-8.6 2.7 L-8.6 1 L-1.8 -3.6 C-1.8 -6.2 -1.3 -9 0 -9 Z';
    var I = { // inline icons (viewBox 24) — CSP-safe, no external assets
      plane: '<path d="' + PLANE_D + '"/>',
      arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/>',
      edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
      map: '<path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/>',
      up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
      down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
      key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.5 12.5 20 3M16 7l3 3M18 5l2 2"/>',

            var home = new Intl.DateTimeFormat(loc, { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: use12h }).format(ms);
            var shown = (times.revised && rev.time !== '—') ? rev.time : sched.time;
            if (home && home !== shown) html += '<div class="ft-homez">' + esc(home) + ' ' + esc(L.yourtime) + '</div>';
          } catch (e) { /* ignore */ }
        }
      }
      return html + '</div>';
    }

    // en-route progress bar as inline SVG (no map needed)
    function progressBar(leg) {
      var s = leg.status; if (!s) return '';
      var dep = toMs((s.departure && (s.departure.revised || s.departure.scheduled)));
      var arr = toMs((s.arrival && (s.arrival.revised || s.arrival.scheduled)));
      var fr = 0.5;
      if (dep != null && arr != null && arr > dep) fr = Math.max(0.02, Math.min(0.98, (Date.now() - dep) / (arr - dep)));
      var pct = (fr * 100).toFixed(1);
      return '<div class="ft-prog"><div class="track"></div><div class="fill" style="width:' + pct + '%"></div>' +
        '<div class="end"></div><div class="end r"></div><div class="dot" style="left:' + pct + '%"></div></div>';
    }

    function legTimes(leg) {
      var s = leg.status;
      return {
        dep: { scheduled: (s && s.departure && s.departure.scheduled) || leg.depTime || null, revised: (s && s.departure && s.departure.revised) || null },
        arr: { scheduled: (s && s.arrival && s.arrival.scheduled) || leg.arrTime || null, revised: (s && s.arrival && s.arrival.revised) || null,
          utc: (s && s.arrival && (s.arrival.revisedUtc || s.arrival.scheduledUtc)) || null }
      };
    }

    function renderLeg(leg, idx, total) {
      var s = leg.status, live = leg.live;
      var depIata = (s && s.departure && s.departure.iata) || leg.from || '—';
      var arrIata = (s && s.arrival && s.arrival.iata) || leg.to || '—';
      var depName = (s && s.departure && s.departure.name) || '';
      var arrName = (s && s.arrival && s.arrival.name) || '';
      var airline = (s && s.airline) || leg.airline || '';
      var t = legTimes(leg);

      var head = '<div class="ft-head">' + (total > 1 ? '<span class="ft-seq">' + (idx + 1) + '</span>' : '') + svg('plane') +
        '<span class="ft-flight">' + esc(withSpace(leg.number || (s && s.number) || '')) + '</span>' +
        (airline ? '<span class="ft-air">' + esc(airline) + '</span>' : '') +
        (s ? chip(s.status) : '') + '</div>';

      var route = '<div class="ft-route">' +
        '<div class="ft-ap dep"><div class="ft-iata">' + esc(depIata) + '</div>' + (depName ? '<div class="ft-apname">' + esc(depName) + '</div>' : '') + '</div>' +
        '<div class="ft-arrow">' + svg('arrow', 'ft-rtlflip') + '</div>' +
        '<div class="ft-ap arr"><div class="ft-iata">' + esc(arrIata) + '</div>' + (arrName ? '<div class="ft-apname">' + esc(arrName) + '</div>' : '') + '</div></div>';

      var times = '<div class="ft-times">' + timeCol(L.dep, t.dep, s ? s.depDelayMin : null, false) + '<div class="mid"></div>' + timeCol(L.arr, t.arr, s ? s.delayMin : null, true) + '</div>';

      var prog = (live && isAirborne(s && s.status) && live.lat != null && !live.onGround) ? progressBar(leg) : '';

      var depC = (s && s.departure && s.departure.lat != null && s.departure.lon != null) ? { lat: s.departure.lat, lon: s.departure.lon } : null;
      var arrC = (s && s.arrival && s.arrival.lat != null && s.arrival.lon != null) ? { lat: s.arrival.lat, lon: s.arrival.lon } : null;
      // adsb.fi reports how old a position is (seen_pos). It was fetched and shipped
      // but never read, so over a coverage hole — mid-Atlantic, Siberia, the Pacific
      // — a frozen fix was drawn with the same confident pulsing dot as a live one.
      var fixAge = (live && typeof live.seenPos === 'number') ? live.seenPos : null;
      var fixStale = fixAge != null && fixAge > 300;    // 5 min: shown, but marked stale
      var fixGone = fixAge != null && fixAge > 1800;    // 30 min: treat as a coverage gap
      var hasFix = live && live.lat != null && !live.onGround && !fixGone;
      var planeC = hasFix ? { lat: live.lat, lon: live.lon, track: live.track } : null;
      var airborne = s && isAirborne(s.status);
      var done = airborne || (s && s.status === 'Arrived');   // past the gate
      var cancelled = s && isCancelled(s.status);

      // ---- BAND 1 · STATE: where the aircraft is, and which aircraft it is ----
      var stateLabel = '', stateBody = '';
      if (cancelled) {
        stateLabel = LS[s.status] || s.status;
        stateBody = cluster([kv('', LS[s.status] || s.status, 'trek-chip--danger', 'x')]);
      } else if (hasFix) {
        var vr = live.verticalRate, trend = vr != null && vr > 64 ? svg('up') : (vr != null && vr < -64 ? svg('down') : '');
        stateLabel = L.inair;
        var liveChip = fixStale
          ? '<span class="trek-chip ft-p"><span class="ft-dot ft-dot--idle" aria-hidden="true"></span><span class="ft-v">' + esc(L.inair) + '</span></span>'
          : '<span class="trek-chip trek-chip--success ft-p"><span class="ft-dot pulse" aria-hidden="true"></span><span class="ft-v">' + esc(L.inair) + '</span></span>';
        stateBody = cluster([
          liveChip,
          (live.desc || live.type) ? kv('', live.desc || live.type) : '',
          live.reg ? kv(L.reg, live.reg) : '',
        ]) + '<div class="ft-grid">' + stat(L.alt, fmtAlt(live.altBaro) + (trend ? ' ' + trend : '')) + stat(L.spd, fmtSpd(live.groundSpeed)) + '</div>' +
          (fixStale ? '<p class="trek-faint ft-sub ft-nosig">' + esc(L.lastseen + ' ' + fmtDur(Math.round(fixAge / 60))) + '</p>' : '');
      } else if (live && live.onGround) {
        stateLabel = L.onground;
        stateBody = cluster([
          '<span class="trek-chip ft-p"><span class="ft-dot ft-dot--idle" aria-hidden="true"></span><span class="ft-v">' + esc(L.onground) + '</span></span>',
          live.reg ? kv(L.reg, live.reg) : '',
        ]);
      } else if (airborne) {
        // status says airborne but no ADS-B fix right now (coverage gap) — keep the map
        stateLabel = L.inair;
        stateBody = cluster(['<span class="trek-chip ft-p"><span class="ft-dot ft-dot--idle" aria-hidden="true"></span><span class="ft-v">' + esc(L.inair) + '</span></span>']) +
          '<p class="trek-faint ft-sub ft-nosig">' + esc(L.nosignal) + '</p>';
      }

      // ---- BAND 2 · GROUND: everything that happens at an airport ----
      // Phase suppression instead of a phase router: five guards, no new state.
      var gp = [];
      if (!cancelled) {
        if (leg.seat) gp.push(kv(L.seat, leg.seat, 'trek-chip--accent', 'seat'));
        if (s) {
          if (s.departure.terminal && !done) gp.push(kv(L.terminal + ' ' + depIata, s.departure.terminal));
          if (s.departure.gate && !done) gp.push(kv(L.gate + ' ' + depIata, s.departure.gate));
          if (s.arrival.terminal) gp.push(kv(L.terminal + ' ' + arrIata, s.arrival.terminal));
          if (s.arrival.gate) gp.push(kv(L.gate + ' ' + arrIata, s.arrival.gate));
          if (s.arrival.baggageBelt && done) gp.push(kv(L.belt, s.arrival.baggageBelt));
          // boarding estimate (~40 min before scheduled departure, airport-local)
          if (!airborne && s.status !== 'Arrived' && s.status !== 'Boarding' && s.status !== 'GateClosed' && currentPhase !== 'past') {
            var depLoc = s.departure && (s.departure.revised || s.departure.scheduled), dmn = minsOf(depLoc), depAbs = toMs(depLoc);
            if (dmn != null && depAbs && (depAbs - 40 * 60000) > Date.now()) {
              var bm = (dmn - 40 + 1440) % 1440, bh = Math.floor(bm / 60), bmi = bm % 60;
              gp.push(kv(L.boarding, '~' + (bh < 10 ? '0' : '') + bh + ':' + (bmi < 10 ? '0' : '') + bmi, 'trek-chip--info', 'clock'));
            }
          }
        }
        // "your aircraft is inbound" — before departure, where the assigned tail is now
        if (leg.inbound && leg.inbound.lat != null && !hasFix) {
          var ib = leg.inbound, etaTxt = '';
          if (depC && ib.groundSpeed > 60) {
            var ikm = haversineKm({ lat: ib.lat, lon: ib.lon }, depC), etaMin = Math.round((ikm / 1.852) / ib.groundSpeed * 60);
            if (etaMin > 0 && etaMin < 600) etaTxt = ' · ' + L.remaining + ' ~' + fmtDur(etaMin);
          }
          gp.push(kv(L.inbound, (ib.reg || '') + etaTxt, '', 'plane'));
        }
      }

      // ---- BAND 3 · WEATHER at the destination (label is the arrival IATA) ----
      var wxBody = cancelled ? '' : weatherBody(leg.weather);

      var bands = [
        { l: stateLabel, b: stateBody },
        { l: L.ground, b: cluster([gp.join('')]) },
        { l: arrIata, b: wxBody },
      ].filter(function (x) { return x.b; });
      var bandsHtml = bands.map(function (x, i) { return band(x.l, x.b, i === 0 ? ' ft-band--first' : ''); }).join('');

      // Show the map whenever we know the route (both airport coords) OR have a
      // live fix — for scheduled, en-route, coverage-gap AND arrived flights alike.
      // The plane dot only appears with a live fix. Guarded so a map error can
      // never blank the rest of the widget.
      var mapHtml = '';
      try { if (((depC && arrC) || hasFix) && !cancelled) mapHtml = drawMap(depC, arrC, planeC); } catch (e) { mapHtml = ''; }

      // ---- BAND 4 · PROGRESS: folded under the map it describes. No pills here —
      // every value is a live measurement.
      var progBody = '';
      if (hasFix && !cancelled) {
        var dms = toMs(s && s.departure && (s.departure.revised || s.departure.scheduled));
        var ams = toMs(s && s.arrival && (s.arrival.revised || s.arrival.scheduled));
        var r1 = [], r2 = [];
        if (dms && ams && ams > dms) r1.push(num(Math.round(Math.max(0, Math.min(1, (Date.now() - dms) / (ams - dms))) * 100) + ' %', true, ' data-tick="pct" data-dep="' + dms + '" data-arr="' + ams + '"') + faint(L.flown));
        if (ams && ams > Date.now()) { var rem = fmtDur(Math.round((ams - Date.now()) / 60000)); if (rem) r1.push(faint(L.remaining) + num(rem, true, ' data-tick="rem" data-arr="' + ams + '"')); }
        if (arrC) r2.push(num(fmtDist(haversineKm(planeC, arrC)), true) + faint(L.togo));
        if (live.hex) {
          var mi = mapLinks.length; mapLinks.push(live.hex);
          r2.push('<a class="trek-btn trek-btn--ghost ft-btn-xs" href="#" data-map="' + mi + '">' + svg('map') + esc(L.openmap) + '</a>');
        }
        var row = function (p) { return p.length ? '<div class="ft-progrow">' + p.join('<span class="ft-grow"></span>') + '</div>' : ''; };
        // The button goes through trek:openExternal (the sandbox has no allow-popups).
        // The URL is NOT also printed as text: this link is an optional convenience,
        // not load-bearing — the coordinates below are the actual data, and a
        // permanently visible raw URL is noise in a card this dense. (The RapidAPI
        // link in the keyless admin state IS load-bearing and does print its URL.)
        progBody = row(r1) + (mapHtml ? '' : prog) + row(r2) +
          '<div class="trek-faint ft-sub ft-coords">' + esc(fmtCoord(live.lat, live.lon)) + '</div>';
      }
      var progHtml = band(L.progress, progBody, ' ft-band--stack');

      // Flights with no status yet still explain themselves.
      var hint = '';
      if (!s && currentPhase === 'upcoming') hint = '<p class="ft-hint">' + esc(L.soon) + '</p>';
      else if (!s && currentPhase === 'active') hint = '<p class="ft-hint">' + esc(L.nostatus) + '</p>';

      // the minimap now conveys flown-vs-remaining, so the linear bar is only a
      // fallback when there's no map (e.g. status but no airport coords)
      return '<div class="ft-leg ft-panel">' + head + route + times +
        ((mapHtml || progBody) ? '' : prog) + bandsHtml + hint + mapHtml + progHtml + '</div>';
    }

    function collapsedLeg(leg, idx) {
      var s = leg.status;
      var from = leg.from || (s && s.departure && s.departure.iata) || '';
      var to = leg.to || (s && s.arrival && s.arrival.iata) || '';
      return '<button type="button" class="ft-collapsed" data-exp="' + idx + '" aria-expanded="false">' + svg('check') +
        '<span class="rt">' + esc(withSpace(leg.number)) + '</span>' +
        '<span class="grow"><span>' + esc(from) + '</span><span>' + arrowSep() + '</span><span>' + esc(to) + '</span></span>' +
        '<span>' + esc(LS[s.status] || s.status) + '</span></button>';
    }

    // Layover on ABSOLUTE time. This used to subtract minute-of-day values and wrap
    // any negative result into [0,1439] — so an inbound delayed past its connection
    // (arrive 17:30, next departs 15:30) rendered as a comfortable "22 h layover"
    // in neutral grey, at exactly the moment the connection was gone. The wrap also
    // made the `.broken` state unreachable. UTC instants are used when the status
    // provides them; the local-clock difference is only a fallback, and one that
    // cannot distinguish "next day" from "already missed" — so it never claims a
    // connection is broken.
    function layover(prev, next) {
      var aUtc = prev.status && prev.status.arrival && (prev.status.arrival.revisedUtc || prev.status.arrival.scheduledUtc);
      var dUtc = next.status && next.status.departure && (next.status.departure.revisedUtc || next.status.departure.scheduledUtc);
      var a = (prev.status && prev.status.arrival && (prev.status.arrival.revised || prev.status.arrival.scheduled)) || prev.arrTime;
      var d = (next.status && next.status.departure && (next.status.departure.revised || next.status.departure.scheduled)) || next.depTime;
      var mins = null, exact = false;
      var am2 = toMs(aUtc), dm2 = toMs(dUtc);
      if (am2 != null && dm2 != null) { mins = Math.round((dm2 - am2) / 60000); exact = true; }
      else {
        var am = minsOf(a), dm = minsOf(d);
        if (am != null && dm != null) { mins = dm - am; if (mins < 0) mins += 1440; }
      }
      var at = next.from || (next.status && next.status.departure && next.status.departure.iata) || '';
      var cls = 'ft-layover', extra = '';
      var broken = exact && mins != null && mins < 0;
      var dur = (mins != null && !broken) ? fmtDur(mins) : null;
      if (broken) { cls += ' broken'; extra = ' · ' + L.brokenConn; }
      else if (mins != null && mins < 45) { cls += ' tight'; extra = ' · ' + L.tightConn; }
      var warn = broken || (mins != null && mins < 45);
      return '<div class="' + cls + '"><span class="ln"></span><span>' + svg(warn ? 'alert' : 'arrow', warn ? '' : 'ft-rtlflip') + ' ' + esc(L.layover) + (at ? ' ' + esc(at) : '') + (dur ? ' · ' + dur : '') + extra + '</span></div>';
    }

    function journeyHeader(data, legs) {
      var b = data.booking || {};
      var origin = b.origin || (legs[0] && legs[0].from) || '';
      var dest = b.dest || (legs[legs.length - 1] && legs[legs.length - 1].to) || '';
      var stops = [origin];
      for (var i = 0; i < legs.length; i++) { var to = legs[i].to || (legs[i].status && legs[i].status.arrival && legs[i].status.arrival.iata); if (to) stops.push(to); }
      // .ft-journey .rt is a flex row, so each stop and separator is its own flex item
      // and the whole chain reorders under dir=rtl — only the glyph has to turn around.
      var route = stops.map(function (x) { return '<span>' + esc(x) + '</span>'; })
        .join('<span style="color:var(--text-faint)">' + arrowSep() + '</span>');
      // overall status = worst; aggregate arrival delay = last leg's delay
      var order = { Canceled: 5, Cancelled: 5, Diverted: 4, Delayed: 3, EnRoute: 2, Departed: 2, Approaching: 2, Boarding: 1 };
      var worst = null, worstScore = -1;
      legs.forEach(function (l) { var st = l.status && l.status.status; if (st && (order[st] || 0) > worstScore) { worstScore = order[st] || 0; worst = st; } if (st === 'Arrived' && worst == null) worst = 'Arrived'; });
      var totalMin = (b.depMs && b.arrMs && b.arrMs > b.depMs) ? Math.round((b.arrMs - b.depMs) / 60000) : null;
      var sub = [];
      sub.push(legs.length + ' ' + (legs.length === 1 ? L.leg : L.legs));
      if (totalMin) sub.push(fmtDur(totalMin) + ' ' + L.total);
      return '<div class="ft-journey"><div><div class="rt">' + route + '</div><div class="sub">' + sub.join(' · ') + '</div></div><div class="spacer"></div>' + (worst ? chip(worst) : '') + '</div>';
    }

    function nextDepartureMs(data, legs) {
      // countdown targets the next not-yet-departed leg
      var now = Date.now();
      for (var i = 0; i < legs.length; i++) {
        var s = legs[i].status;
        if (s && isAirborne(s.status)) return null; // already flying
        if (s && s.status === 'Arrived') continue;
        var dep = s ? toMs(s.departure && (s.departure.revised || s.departure.scheduled)) : null;
        if (dep && dep > now) return dep;
      }
      return (data.booking && data.booking.depMs && data.booking.depMs > now) ? data.booking.depMs : null;
    }

    // The footer prints "Updated 4m" straight off data.updatedAt, and that timestamp
    // keeps ticking up whether or not the fetch is still succeeding — so a dropped
    // network or a RapidAPI 429 was completely invisible: the card just quietly froze.
    // These notes say what the timestamp cannot.
    function note(text, mod, icon) {
      return '<div class="ft-note' + (mod || '') + '">' + svg(icon || 'alert') + '<span>' + esc(text) + '</span></div>';
    }
    function footNotes(data) {
      var out = '';
      // Server rejected by AeroDataBox (401/403). Schedule data is gone until an admin
      // fixes it, but the adsb.fi half is unaffected — say so, or it reads as "broken".
      if (data.keyInvalid) out += note(L.keyrejected, ' ft-note--warn', 'key');
      // One miss is a blip; three in a row is a state the user should know about.
      if (failCount >= 1) out += note(L.stale, failCount >= 3 ? ' ft-note--warn' : '', 'alert');
      // A forced refresh that was rate-limited returns the CACHED payload — without
      // this note the button looks like it did nothing.
      if (data.throttled) out += note(L.throttled, '', 'clock');
      if (typeof data.quotaRemaining === 'number' && data.quotaRemaining < 50) {
        out += note(L.quotaleft + ': ' + nfmt(data.quotaRemaining), '', 'alert');
      }
      return out;
    }

    function collapseEmpty() {
      var d = document.documentElement;
      app.innerHTML = '';
      d.setAttribute('data-ft-empty', '');
      if (window.trek && window.trek.resize) { try { window.trek.resize(1); } catch (e) {} }
    }

    function render(data) {
      mapLinks = [];
      if (!ctx || !ctx.reservationId) { collapseEmpty(); return; }
      if (!data) { document.documentElement.removeAttribute('data-ft-empty'); app.innerHTML = '<div class="ft-skel big"></div><div class="ft-skel line" style="width:55%"></div>'; return; }
      if (data.applicable === false) { collapseEmpty(); return; }
      document.documentElement.removeAttribute('data-ft-empty');

      currentPhase = (data.booking && data.booking.phase) || 'active';
      var legs = data.legs || [];
      var anyCancelled = legs.some(function (l) { return l.status && isCancelled(l.status.status); });
      var html = '';

      // cancellation banner (suppresses countdown)
      if (anyCancelled) {
        var cl = legs.filter(function (l) { return l.status && isCancelled(l.status.status); })[0];
        html += '<div class="ft-banner">' + svg('alert') + esc(withSpace(cl.number) + ' ' + (LS[cl.status.status] || cl.status.status)) + '</div>';
      } else if (data.booking && data.booking.phase !== 'past') {
        var nd = nextDepartureMs(data, legs);
        if (nd) { var cd = fmtCountdown(nd); if (cd) html += '<div class="ft-countdown">' + svg('plane') + '<span>' + esc(L.departsIn) + ' <b data-tick="cd" data-dep="' + nd + '">' + esc(cd) + '</b></span></div>'; }
      }

      if (legs.length > 1) html += journeyHeader(data, legs);

      if (legs.length) {
        for (var i = 0; i < legs.length; i++) {
          if (i > 0) html += layover(legs[i - 1], legs[i]);
          var s = legs[i].status;
          var collapsible = legs.length > 2 && s && s.status === 'Arrived' && !expanded[i];
          html += collapsible ? collapsedLeg(legs[i], i) : renderLeg(legs[i], i, legs.length);
        }
      } else {
        html += '<p class="ft-empty">' + esc(data.hint ? L.couldnt : L.noflight) + '</p>' +
          '<div class="ft-editrow"><input class="trek-input" id="ft-in" placeholder="' + esc(L.enter) + '" aria-label="' + esc(L.enter) + '" />' +
          '<button type="button" class="trek-btn trek-btn--primary" id="ft-save">' + esc(L.link) + '</button></div>' +
          '<div class="ft-keyrow"><button type="button" class="ft-keytoggle" id="ft-redetect">' + svg('scan') + ' ' + esc(L.redetect) + '</button></div>';
      }

      if (editing && legs.length) {
        html += '<div class="ft-editrow"><input class="trek-input" id="ft-in" value="' + esc(withSpace((legs[0] && legs[0].number) || '')) + '" placeholder="' + esc(L.enter) + '" aria-label="' + esc(L.enter) + '" />' +
          '<button type="button" class="trek-btn trek-btn--primary" id="ft-save">' + esc(L.save) + '</button></div>';
      }

      // AeroDataBox key — instance-wide. The gate is data.canSetKey, computed by
      // the SERVER from req.user.isAdmin (reliable since TREK 3.4 / TREK#1569);
      // the client's own notion of admin is never trusted, so the server stays the
      // single source of truth. Non-admins only get the informational hint, which
      // explains the missing schedule/gate data and points at the admin.
      // Once a key IS active there is nothing to say: the row would otherwise
      // repeat "key active · Replace · Remove" on every single flight reservation,
      // which is noise on a setting that is instance-wide and set once. Managing an
      // existing key is a rare, deliberate act — it lives in the README's console
      // command (POST /api/plugins/flight-tracker/key with an empty apiKey), not on
      // every widget. Only the two actionable states render anything.
      // Both keyless branches used to be dead ends: they said what was missing and
      // offered nowhere to go, and neither ever mentioned that the plugin's OTHER
      // half — the live adsb.fi position — needs no key at all. Say both.
      if (data.applicable !== false && legs.length && !data.hasKey) {
        if (data.canSetKey) {
          html += '<div class="ft-keyrow">';
          if (keyOpen) {
            html += '<div class="ft-editrow"><input class="trek-input" id="ft-keyin" type="password" placeholder="' + esc(L.keyph) + '" aria-label="' + esc(L.keyph) + '" />' +
              '<button type="button" class="trek-btn trek-btn--primary" id="ft-keysave">' + esc(L.save) + '</button></div>' +
              '<p class="ft-hint">' + esc(L.keyhint) + '</p>';
          } else {
            html += '<button type="button" class="ft-keytoggle" id="ft-keyt">' + svg('key') + ' ' + esc(L.keyadd) + '</button>';
          }
          html += '<div><button type="button" class="ft-keytoggle" id="ft-keyurl">' + svg('ext') + ' ' + esc(L.keyget) + '</button>' +
            '<span class="trek-faint ft-sub ft-url">' + esc(RAPIDAPI_URL) + '</span></div>' +
            '<p class="ft-hint ft-keyadmin">' + svg('wifi') + ' ' + esc(L.keyless) + '</p>';
          html += '</div>';
        } else {
          html += '<div class="ft-keyrow"><p class="ft-hint ft-keyadmin">' + svg('key') + ' ' + esc(L.keyconfig) + '</p>' +
            '<p class="ft-hint ft-keyadmin">' + svg('wifi') + ' ' + esc(L.keyless) + '</p></div>';
        }
      }

      if (legs.length) {
        html += '<div class="ft-foot"><span class="ft-updated">' + esc(L.updated) + ' ' + relTime(data.updatedAt) + (data.source === 'detected' ? ' · ' + esc(L.detected) : '') + '</span><span class="ft-actions">' +
          '<button type="button" class="ft-iconbtn" id="ft-redetect" title="' + esc(L.redetect) + '" aria-label="' + esc(L.redetect) + '">' + svg('scan') + '</button>' +
          '<button type="button" class="ft-iconbtn" id="ft-edit" title="' + esc(L.change) + '" aria-label="' + esc(L.change) + '">' + svg('edit') + '</button>' +
          '<button type="button" class="ft-iconbtn" id="ft-refresh" title="' + esc(L.refresh) + '" aria-label="' + esc(L.refresh) + '">' + svg('refresh') + '</button>' +
          '</span></div>' + footNotes(data);
      }
      if (data.errors && data.errors.length && legs.length) html += '<div class="ft-err">' + esc(data.errors.join(' · ')) + '</div>';

      app.innerHTML = html;
      wire();
    }

    function wire() {
      var s = document.getElementById('ft-save'), i = document.getElementById('ft-in');
      if (s && i) { var go = function () { saveNumber(i.value); }; s.addEventListener('click', go); i.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } }); }
      var e = document.getElementById('ft-edit'); if (e) e.addEventListener('click', function () { editing = !editing; render(last); });
      var r = document.getElementById('ft-refresh'); if (r) r.addEventListener('click', function () { doRefresh(r); });
      document.querySelectorAll('#ft-redetect').forEach(function (rd) { rd.addEventListener('click', function () { redetect(rd); }); });
      document.querySelectorAll('.ft-collapsed[data-exp]').forEach(function (c) { c.addEventListener('click', function () { expanded[c.getAttribute('data-exp')] = true; saveExpanded(); render(last); }); });
      app.querySelectorAll('a[data-map]').forEach(function (a) { a.addEventListener('click', function (ev) { ev.preventDefault(); var h = mapLinks[+a.getAttribute('data-map')]; if (h) window.trek.openExternal(ADSB_URL + encodeURIComponent(h)); }); });
      var kt = document.getElementById('ft-keyt'); if (kt) kt.addEventListener('click', function () { keyOpen = true; render(last); });
      var ku = document.getElementById('ft-keyurl'); if (ku) ku.addEventListener('click', function (ev) { ev.preventDefault(); if (window.trek.openExternal) window.trek.openExternal(RAPIDAPI_URL); });
      var ks = document.getElementById('ft-keysave'), ki = document.getElementById('ft-keyin');
      if (ks && ki) { var gk = function () { saveKey(ki.value); }; ks.addEventListener('click', gk); ki.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); gk(); } }); }
    }

    function spin(btn, on) { var v = btn && btn.querySelector && btn.querySelector('svg'); if (v) v.classList[on ? 'add' : 'remove']('ft-spin'); }

    // Persist the instance-wide AeroDataBox key. The server re-checks admin rights
    // and answers 403 if they are missing, so this is a convenience gate only.
    async function saveKey(v) {
      if (busy) return;
      busy = true;
      var clearing = !String(v || '').trim();
      var g = begin();
      try {
        await window.trek.invoke('/key', { method: 'POST', body: { apiKey: v } });
        if (!forCurrent(g)) { busy = false; return; }
        applied(g);
        keyOpen = false;
        window.trek.notify('success', clearing ? L.keycleared : L.keysaved);
        // doRefresh has its own `busy` guard now, so hand the flag back first or the
        // follow-up refresh would be swallowed and the card would keep the old state.
        busy = false;
        await doRefresh(null);
        return;
      } catch (e) {
        if (forCurrent(g)) window.trek.notify('error', (e && (e.code === 403 || e.status === 403)) ? L.keynotallowed : (e.message || 'error'));
      }
      busy = false;
    }

    async function saveNumber(v) {
      if (busy) return;
      busy = true;
      var g = begin();
      try {
        var d = await window.trek.invoke('/set', { method: 'POST', body: { tripId: ctx.tripId, reservationId: ctx.reservationId, flightNumber: v, locale: (ctx && ctx.locale) || '' } });
        if (current(g)) { applied(g); failCount = 0; editing = false; last = d; render(d); }
      } catch (e) {
        if (forCurrent(g)) window.trek.notify('error', e.message || 'error');
      }
      busy = false;
    }

    // Destructive: an empty flightNumber deletes the manual override AND the ctx.meta
    // mirror, with no undo. `danger: false` is passed EXPLICITLY — the host defaults
    // `danger` to true, and a red "delete" dialog overstates a re-detect.
    async function redetect(btn) {
      if (busy) return;
      if (window.trek.confirm) {
        if (confirmOpen) return;   // a 2nd concurrent confirm is auto-answered false, invisibly
        confirmOpen = true;
        var ok = false;
        try {
          ok = await window.trek.confirm({ title: L.redetectTitle, message: L.redetectMsg, confirmLabel: L.redetectYes, cancelLabel: L.cancel, danger: false });
        } catch (e) { ok = false; }
        confirmOpen = false;
        if (!ok) return;
        if (busy) return;          // the dialog was open for a while; re-check
      }
      busy = true;
      spin(btn, true);
      var g = begin();
      try {
        var d = await window.trek.invoke('/set', { method: 'POST', body: { tripId: ctx.tripId, reservationId: ctx.reservationId, flightNumber: '', locale: (ctx && ctx.locale) || '' } });
        if (current(g)) {
          applied(g); failCount = 0; editing = false; expanded = {}; saveExpanded(); last = d; render(d);
          window.trek.notify('success', L.redetected);
        }
      } catch (e) {
        if (forCurrent(g)) window.trek.notify('error', e.message || 'error');
      }
      spin(btn, false);
      busy = false;
    }

    // Guarded like the other mutators: every POST /refresh forces a per-leg
    // AeroDataBox fetch server-side, so a double-tap costs two quota units.
    async function doRefresh(btn) {
      if (busy) return;
      busy = true;
      spin(btn, true);
      var g = begin();
      try {
        var d = await window.trek.invoke('/refresh', { method: 'POST', body: { tripId: ctx.tripId, reservationId: ctx.reservationId, locale: (ctx && ctx.locale) || '' } });
        if (current(g)) { applied(g); failCount = 0; last = d; render(d); }
      } catch (e) {
        if (forCurrent(g)) window.trek.notify('error', e.message || 'error');
      }
      spin(btn, false);   // also on SUCCESS — render() may have replaced the node, which is harmless
      busy = false;
    }

    // Screen-reader announcements. The widget's whole premise is that it updates
    // itself, yet none of it was announced. A blanket aria-live on #app would be
    // worse than silence — it would re-read route, times, weather and coordinates
    // every minute — so this region is a SIBLING of #app (render() never rebuilds
    // it) and receives only what actually CHANGED.
    function announce(d) {
      var region = document.getElementById('ft-live');
      if (!region || !last || !d || !Array.isArray(d.legs)) return;
      var prev = {};
      (last.legs || []).forEach(function (l) { if (l && l.number) prev[l.number] = l; });
      var msgs = [];
      (d.legs || []).forEach(function (l) {
        var s = l && l.status, p = prev[l.number], ps = p && p.status;
        if (!s || !ps) return;
        var num = withSpace(l.number);
        if (s.status !== ps.status) msgs.push(num + ' ' + (LS[s.status] || s.status));
        else if (s.delayMin != null && s.delayMin !== ps.delayMin && Math.abs(s.delayMin) >= 5) {
          msgs.push(num + ' ' + (s.delayMin > 0 ? '+' : '') + s.delayMin + ' ' + L.min);
        } else if (s.depDelayMin != null && s.depDelayMin !== ps.depDelayMin && Math.abs(s.depDelayMin) >= 5) {
          msgs.push(num + ' ' + (s.depDelayMin > 0 ? '+' : '') + s.depDelayMin + ' ' + L.min);
        } else {
          var g = (s.departure && s.departure.gate) || (s.arrival && s.arrival.gate);
          var pg = (ps.departure && ps.departure.gate) || (ps.arrival && ps.arrival.gate);
          if (g && g !== pg) msgs.push(num + ' ' + L.gate + ' ' + g);
        }
      });
      if (msgs.length) region.textContent = msgs.join('. ');
    }

    // render() replaces the whole card via innerHTML, which destroys focus and any
    // half-typed value. The poll runs every minute, so without this guard an admin
    // pasting a RapidAPI key — the one setup step the plugin depends on — could
    // have the field wiped mid-paste, and a keyboard user was thrown back to the
    // top of the card every 60s. Keep fetching; just defer the repaint.
    function interactive() {
      if (editing || keyOpen) return true;
      var a = document.activeElement;
      return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && app.contains(a));
    }

    async function load() {
      if (!ctx || !ctx.reservationId) { render(null); return; }
      var g = begin();
      try {
        var d = await window.trek.invoke('/status?tripId=' + encodeURIComponent(ctx.tripId || '') + '&reservationId=' + encodeURIComponent(ctx.reservationId) + '&locale=' + encodeURIComponent((ctx && ctx.locale) || ''));
        // Dropped, not rendered: the card may have moved to another reservation while
        // this was in flight, or a newer response may already be on screen.
        if (!current(g)) return;
        applied(g);
        failCount = 0;
        announce(d);
        last = d;
        if (!interactive()) render(d);
      } catch (e) {
        if (!forCurrent(g)) return;
        // keep the last good data on a transient poll failure instead of wiping it —
        // but repaint so the footer can admit that it is no longer updating
        failCount++;
        if (!last) app.innerHTML = '<p class="ft-err">' + esc(e.message || 'error') + '</p>';
        else if (!interactive()) render(last);
      }
    }

    // Repaint once the user is done typing, so a deferred update is never lost.
    document.addEventListener('focusout', function () {
      setTimeout(function () { if (last && !interactive()) render(last); }, 0);
    });

    // Self-scheduling poll: pause while the tab is hidden, stop once the flight is
    // done, poll slowly for far-future flights — to spare the AeroDataBox quota.
    var pollT = null, tickT = null, visWired = false, lastPollKey = null;
    function pollDelay() {
      if (!last) return 60000;
      var b = last.booking || {}, legs = last.legs || [];
      if (b.phase === 'past') return 0;
      if (legs.length && legs.every(function (l) { return l.status && l.status.status === 'Arrived'; })) return 0;
      if (b.phase === 'upcoming') return 600000;
      return 60000;
    }
    // Everything pollDelay() actually depends on, as one comparable string. The host
    // re-sends context on every theme/accent/density/motion/locale/format change, and
    // re-arming the timer on each of those pushed the next poll further and further
    // out (or restarted a 600 s wait) for no reason.
    function pollKey() {
      if (!last) return 'none';
      var b = last.booking || {}, legs = last.legs || [];
      var allArrived = !!legs.length && legs.every(function (l) { return l.status && l.status.status === 'Arrived'; });
      return (b.phase || '') + '|' + (allArrived ? '1' : '0');
    }
    function scheduleNext() {
      if (pollT) { clearTimeout(pollT); pollT = null; }
      if (tickT) { clearInterval(tickT); tickT = null; }
      lastPollKey = pollKey();
      var d = pollDelay();
      if (d > 0) { pollT = setTimeout(tick, d); tickT = setInterval(tickLocal, 30000); }
    }
    async function tick() { pollT = null; if (!document.hidden) await load(); scheduleNext(); }

    // Local clock tick — NO fetch, NO innerHTML. The `upcoming` poll is 600 s, so
    // "Departs in 2 h 14 min" could be ten minutes stale while looking authoritative.
    // Only the three genuinely time-derived text nodes are rewritten, which is why
    // this can never fight interactive(): it touches no input and no focused node.
    function tickLocal() {
      var nodes = app.querySelectorAll('[data-tick]');
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i], kind = n.getAttribute('data-tick');
        if (kind === 'cd') {
          var t = fmtCountdown(+n.getAttribute('data-dep'));
          // departure time reached: hide the row rather than print a stale number —
          // the next poll rebuilds the card with the real post-departure state
          if (t == null) { var row = n.parentNode && n.parentNode.parentNode; if (row && row.classList && row.classList.contains('ft-countdown')) row.style.display = 'none'; }
          else n.textContent = t;
        } else if (kind === 'pct') {
          var dep = +n.getAttribute('data-dep'), arr = +n.getAttribute('data-arr');
          if (dep && arr && arr > dep) n.textContent = Math.round(Math.max(0, Math.min(1, (Date.now() - dep) / (arr - dep))) * 100) + ' %';
        } else if (kind === 'rem') {
          var a2 = +n.getAttribute('data-arr');
          if (a2 && a2 > Date.now()) { var r = fmtDur(Math.round((a2 - Date.now()) / 60000)); if (r) n.textContent = r; }
        }
      }
    }

    // ---- per-tab UI state (trek.session) -------------------------------------
    // Which completed legs the user opened is pure view state, so it belongs in the
    // host's per-tab store rather than in the plugin's database. Scope 'trip', keyed
    // by reservation. Quotas are 32 keys / 64-char keys / 1 KiB per value, so the
    // value is a bare array of leg indices — and every failure is swallowed: a lost
    // expand is a non-event, and this must never break the card.
    function sessionKey() { var r = resId(); return r ? ('exp:' + String(r)).slice(0, 64) : null; }
    function hasSession() { return !!(window.trek.session && window.trek.session.get && window.trek.session.set); }
    function restoreExpanded(forRes) {
      var k = sessionKey();
      if (!k || !hasSession()) return Promise.resolve();
      var p;
      try { p = window.trek.session.get(k, { scope: 'trip' }); } catch (e) { return Promise.resolve(); }
      if (!p || !p.then) return Promise.resolve();
      return p.then(function (v) {
        // the card may already have moved on while the read was in flight
        if (!Array.isArray(v) || resId() !== forRes) return;
        for (var i = 0; i < v.length; i++) { var n = parseInt(v[i], 10); if (!isNaN(n)) expanded[n] = true; }
      }, function () {});
    }
    function saveExpanded() {
      var k = sessionKey();
      if (!k || !hasSession()) return;
      var idx = [];
      for (var i in expanded) { if (expanded[i]) { var n = parseInt(i, 10); if (!isNaN(n)) idx.push(n); } }
      try { var p = window.trek.session.set(k, idx, { scope: 'trip' }); if (p && p.then) p.then(null, function () {}); } catch (e) {}
    }

    // ---- live refresh pings (trek.onEvent) -----------------------------------
    // The server broadcasts plugin:flight-tracker:updated to the trip from /refresh
    // and /set, so another traveller forcing a refresh or fixing the flight number
    // lands on your card at once. Events are name-only and only arrive while a
    // planner has the trip joined, so the poll above stays the floor, not a backup.
    var evtT = null, evtWired = false;
    function wireEvents() {
      if (evtWired || !window.trek.onEvent) return;
      evtWired = true;
      window.trek.onEvent(function (event, tripId) {
        if (!resId()) return;
        if (tripId != null && ctx && ctx.tripId != null && String(tripId) !== String(ctx.tripId)) return;
        var name = String(event || '');
        if (name !== 'plugin:flight-tracker:updated' && name.indexOf('reservation:') !== 0) return;
        // a /set fans out several events at once — coalesce into one fetch
        if (evtT) clearTimeout(evtT);
        evtT = setTimeout(function () { evtT = null; if (!document.hidden) load(); }, 1500);
      });
    }

    function applyLocale(m) {
      var de = (m.locale || '').toLowerCase().indexOf('de') === 0;
      L = de ? STR.de : STR.en; LS = de ? SL.de : SL.en;
      // The frame is a separate document and does not inherit TREK's lang, so the
      // markup declares lang="en" — German content was being announced with English
      // phonemes by screen readers (WCAG 3.1.1).
      try { document.documentElement.lang = m.locale || (de ? 'de' : 'en'); } catch (e) {}
    }

    window.trek.onContext(function (m) {
      var prev = ctx && ctx.reservationId;
      ctx = m;
      document.documentElement.dataset.theme = resolveTheme(m);
      applyTokens(m);
      applyLocale(m);
      setupFormats(m);
      wireEvents();
      if (m.reservationId !== prev) {
        editing = false; keyOpen = false; expanded = {}; last = null; failCount = 0; render(null);
        restoreExpanded(m.reservationId).then(load).then(scheduleNext);
      } else {
        // A repeated context is a THEME/ACCENT/DENSITY/MOTION/LOCALE/FORMAT change,
        // not new data. Repainting unconditionally wiped a half-typed flight number
        // or a half-pasted API key, so defer exactly like load() does...
        if (last && !interactive()) render(last);
        // ...and only re-arm the poll when what it is scheduled from actually moved.
        if (pollKey() !== lastPollKey) scheduleNext();
      }
      if (!visWired) {
        visWired = true;
        document.addEventListener('visibilitychange', function () { if (!document.hidden) load().then(scheduleNext); });
      }
    });
  })();
  </script>
</body>
</html>
